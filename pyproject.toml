[project]
name = "psf"
version = "0.1.0"
description = "Predictive-State Flows: a continuous diffusion language model with parallel block decoding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12",
    "numpy>=2.2",
    "transformers>=5.10",
    "datasets>=5.0",
    "huggingface_hub>=1.0",
]

[project.optional-dependencies]
eval = ["mauve-text>=0.4"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psf"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end runs of the training entry points"]
